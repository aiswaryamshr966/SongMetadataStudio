spring.application.name=song-metadata-studio
server.address=127.0.0.1
server.port=8765
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=520MB
songtagger.python=${PYTHON_EXECUTABLE:python}
songtagger.ffmpeg=${FFMPEG_EXECUTABLE:ffmpeg}
songtagger.ffprobe=${FFPROBE_EXECUTABLE:ffprobe}
songtagger.output-directory=${SONGTAGGER_OUTPUT_DIRECTORY:}
songtagger.state-directory=${SONGTAGGER_STATE_DIRECTORY:}
